name: Case Validation

on:
  pull_request:
    paths:
      - 'content/cases/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install AJV
        run: npm install -g ajv-cli
      - name: Validate Changed Cases
        run: |
          for f in $(git diff --name-only origin/main -- 'content/cases/*.json'); do
            echo "Validating $f..."
            ajv -s content/schema.json -d "$f"
          done
