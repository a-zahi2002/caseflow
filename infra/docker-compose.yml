version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: caseflow-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-caseflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: caseflow-redis
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    container_name: caseflow-ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-time initialization for Ollama models
  ollama-init:
    image: ollama/ollama:latest
    container_name: caseflow-ollama-init
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: -c "sleep 5 && ollama pull llama3" # Default model
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: caseflow-api
    restart: always
    depends_on:
      - db
      - redis
      - ollama
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-caseflow}?schema=public
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
      PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-supersecret_better_auth_key}
      BETTER_AUTH_URL: http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: caseflow-web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama_data:
